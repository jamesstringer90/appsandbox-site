<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="App Sandbox — isolated, GPU-accelerated Windows VMs on Windows 11.">
<meta name="theme-color" content="#1e1e1e">
<title>App Sandbox</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="wrap">
        <img class="logo-mark" src="appsandbox.svg" alt="App Sandbox logo" width="160" height="160">
        <h1>App Sandbox</h1>
        <p class="tagline">Isolated, GPU-accelerated Windows VMs on Windows&nbsp;11.</p>
        <p class="status"><span class="dot"></span> Coming soon</p>

        <section class="shots">
            <figure>
                <img src="appsandbox.png" alt="App Sandbox VM manager interface" loading="lazy">
                <figcaption>VM Manager — create, snapshot, and launch GPU-PV virtual machines.</figcaption>
            </figure>
            <figure>
                <img src="appsandbox_display.png" alt="App Sandbox displaying a Windows 11 guest desktop" loading="lazy">
                <figcaption>Integrated display — low-latency framebuffer streamed over Hyper-V sockets.</figcaption>
            </figure>
        </section>

        <footer>
            <a href="https://github.com/jamesstringer90/appsandbox" rel="noopener">App Sandbox on Github</a>
        </footer>
    </main>
</body>
</html>
